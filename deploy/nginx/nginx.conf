# Balanceador na frente das réplicas do app (ADR-026). Publica a API no host
# em :8080; as réplicas não publicam porta, então `--scale app=N` não
# conflita.
#
# "server app:8080 resolve" (nginx >= 1.27.3) re-resolve o nome do serviço
# no DNS do Docker (127.0.0.11) a cada 5s: réplicas acrescentadas ou
# removidas por `docker compose up --scale` entram/saem do pool sem reiniciar
# o nginx. Round-robin entre os IPs do serviço.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upstream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream wallet_app {
        zone wallet_app 64k;
        server app:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;

        # Healthcheck do próprio balanceador (não depende das réplicas).
        location = /lb/health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://wallet_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Réplica parando (listener fechado) → conexão recusada → próxima.
            # Requisições não idempotentes só são repetidas se não chegaram a
            # ser enviadas (padrão do nginx), então um POST não é duplicado.
            proxy_next_upstream error timeout http_502;
            proxy_connect_timeout 2s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
        }
    }
}
