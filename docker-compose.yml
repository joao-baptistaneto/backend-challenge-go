# Ambiente local completo (ADR-026). Uso:
#
#   docker compose up --build -d --wait              # 1 réplica
#   docker compose up --build -d --wait --scale app=3
#   make compose-smoke                               # token + API + filas
#
# Portas no host: API (nginx) 8080, Keycloak 8081, LocalStack 4566,
# PostgreSQL 5433 (5432 costuma estar ocupada por um PostgreSQL local).
#
# Tudo aqui é de DESENVOLVIMENTO: senhas do banco, admin do Keycloak e
# segredos de client do realm (deploy/keycloak) são valores fixos e públicos.

name: junglegaming-wallet

x-app-env: &app-env
  APP_ENV: development
  HTTP_ADDR: ":8080"
  LOG_LEVEL: info
  # fx.StopTimeout = SHUTDOWN_TIMEOUT + max(SQS_DRAIN_TIMEOUT, SQS_WAIT_TIME + 5s) +
  # PENDING_WORKER_DRAIN_TIMEOUT + OUTBOX_DRAIN_TIMEOUT + 15s = 75s
  # (ADR-022/025/026); stop_grace_period abaixo é maior que isso.
  SHUTDOWN_TIMEOUT: 15s
  SQS_WAIT_TIME: 20s
  SQS_DRAIN_TIMEOUT: 10s
  PENDING_WORKER_DRAIN_TIMEOUT: 10s
  OUTBOX_DRAIN_TIMEOUT: 10s
  METRICS_ACCESS: internal
  DATABASE_URL: postgres://wallet:wallet-dev-pw@postgres:5432/wallet?sslmode=disable
  DATABASE_MAX_CONNS: "20"
  DATABASE_CONNECT_TIMEOUT: 30s
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566
  SQS_INBOUND_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_INBOUND_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
  SQS_MAX_ATTEMPTS: "3"
  # Issuer = URL pública do Keycloak (KC_HOSTNAME), a mesma do `iss` dos
  # tokens obtidos no host; as chaves vêm pela rede interna do Compose.
  OIDC_ISSUER_URL: http://localhost:8081/realms/junglegaming
  OIDC_JWKS_URL: http://keycloak:8080/realms/junglegaming/protocol/openid-connect/certs
  OIDC_AUDIENCE: wallet-api
  OIDC_PROVIDER_CLAIM: provider_id
  OIDC_PROVIDER_ROLE: wager-provider
  OIDC_INTERNAL_ROLE: wallet-internal

services:
  postgres:
    image: postgres:17-alpine
    # Superusuário de dev (a suíte de integração cria/remove um banco por
    # teste). A senha não pode ser substring comum dos logs ("wallet" é o
    # nome do serviço): os testes verificam que ela não vaza nos logs.
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet-dev-pw
      POSTGRES_DB: wallet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      # Hostname fixo: todo token tem iss=http://localhost:8081/realms/...,
      # não importa se foi pedido do host ou de dentro da rede (ADR-026).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-junglegaming.json:/opt/keycloak/data/import/realm-junglegaming.json:ro
    healthcheck:
      # A imagem não tem curl/wget: HTTP via /dev/tcp do bash. Pronto = realm
      # importado e servindo o discovery.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/junglegaming/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q token_endpoint <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs,iam,sts
      AWS_DEFAULT_REGION: us-east-1
      # path: URLs devolvidas como http://<host>:4566/queue/<região>/<conta>/<fila>
      # (sem DNS *.localstack.cloud); a forma http://<host>:4566/<conta>/<fila>,
      # configurada no app e nos testes, também é aceita.
      SQS_ENDPOINT_STRATEGY: path
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      # Saudável só depois do init hook criar filas, redrive e políticas.
      test: ["CMD-SHELL", "test -f /tmp/sqs-provisioned && curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  migrate:
    build:
      context: .
    image: junglegaming/wallet:local
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://wallet:wallet-dev-pw@postgres:5432/wallet?sslmode=disable
      MIGRATE_TIMEOUT: 2m
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: junglegaming/wallet:local
    pull_policy: never
    environment: *app-env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s
    # >= fx.StopTimeout (75s com os valores acima): o default do Docker (10s)
    # mataria o processo no meio da drenagem.
    stop_grace_period: 90s
    restart: unless-stopped

  lb:
    image: nginx:1.28-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/lb/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
